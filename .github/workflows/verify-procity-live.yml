name: Verify ProCity live galleries

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-procity-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify deployment, D1 data, thumbnails, and galleries
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://procity.ca';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function request(path, kind = 'json') {
            const separator = path.includes('?') ? '&' : '?';
            const response = await fetch(base + path + separator + 'verify=' + Date.now(), {
              headers: { 'user-agent': 'ProCity-live-verifier/1.0' },
              redirect: 'follow'
            });
            if (!response.ok) {
              throw new Error(path + ' returned HTTP ' + response.status);
            }
            return kind === 'json' ? response.json() : response.text();
          }

          function projects(payload) {
            if (Array.isArray(payload)) return payload;
            for (const key of ['projects', 'items', 'results', 'data']) {
              if (Array.isArray(payload?.[key])) return payload[key];
            }
            return [];
          }

          async function findProject(title) {
            const payload = await request('/api/projects?q=' + encodeURIComponent(title) + '&limit=10');
            const list = projects(payload);
            return list.find(item => item?.title === title)
              || list.find(item => String(item?.title || '').toLowerCase().includes(title.toLowerCase()))
              || null;
          }

          function galleryCount(project) {
            if (Array.isArray(project?.images)) return project.images.length;
            return Number(project?.imageCount || 0);
          }

          function assertLocalImage(value, label) {
            if (!String(value || '').startsWith('/project-images/')) {
              throw new Error(label + ' is not a local /project-images/ asset: ' + String(value || '<empty>'));
            }
          }

          const deadline = Date.now() + 35 * 60 * 1000;
          let health;
          let thumbnailProject;
          let attempt = 0;

          while (Date.now() < deadline) {
            attempt += 1;
            try {
              // Each health request advances the versioned D1 catalog/details hydration.
              for (let index = 0; index < 40; index += 1) {
                health = await request('/api/health?hydrate=' + attempt + '-' + index);
                await sleep(250);
              }
              thumbnailProject = await findProject('1 Thousand Bay Condos');
              if (
                health?.status === 'ok'
                && health?.databaseReady === true
                && Number(health?.projectCount) === 3502
                && String(thumbnailProject?.image || '').startsWith('/project-images/')
              ) break;
            } catch (error) {
              console.log('Deployment not ready on attempt ' + attempt + ': ' + error.message);
            }
            await sleep(20000);
          }

          if (!health || Number(health.projectCount) !== 3502) {
            throw new Error('D1 project count did not reach 3502 before timeout');
          }
          if (!thumbnailProject || !String(thumbnailProject.image || '').startsWith('/project-images/')) {
            throw new Error('New local thumbnail data was not visible before timeout');
          }

          const checks = [
            {
              title: '1 Thousand Bay Condos',
              slug: '1-thousand-bay-condos-100016',
              expected: 5,
              project: thumbnailProject
            },
            {
              title: 'Central Park Condos',
              slug: 'central-park-condos-101441',
              expected: 105,
              project: await findProject('Central Park Condos')
            },
            {
              title: 'The Valley in Woodbridge',
              slug: 'the-valley-in-woodbridge-103146',
              expected: 95,
              project: await findProject('The Valley in Woodbridge')
            },
            {
              title: 'Zen Towns',
              slug: 'zen-towns-103500',
              expected: 4,
              project: await findProject('Zen Towns')
            }
          ];

          const sampledImages = [];
          for (const check of checks) {
            if (!check.project) throw new Error('Missing live API project: ' + check.title);
            assertLocalImage(check.project.image, check.title + ' thumbnail');
            const count = galleryCount(check.project);
            if (count !== check.expected) {
              throw new Error(check.title + ' expected ' + check.expected + ' images, received ' + count);
            }
            if (Array.isArray(check.project.images)) {
              for (const value of check.project.images.slice(0, 3)) {
                assertLocalImage(value, check.title + ' gallery image');
                sampledImages.push(value);
              }
            }

            const pagePath = '/project/' + check.slug + '/';
            const html = await request(pagePath, 'text');
            if (!html.includes('class="project-gallery"')) {
              throw new Error(pagePath + ' does not render the project gallery section');
            }
            if (/mycondopro\.ca|condonow/i.test(html)) {
              throw new Error(pagePath + ' contains a forbidden remote image source');
            }
            if (!html.includes('/project-images/')) {
              throw new Error(pagePath + ' does not contain local project image URLs');
            }
            console.log('PASS page ' + pagePath + ': thumbnail=local gallery=' + count);
          }

          const uniqueSamples = [...new Set(sampledImages)].slice(0, 12);
          if (uniqueSamples.length < 8) {
            throw new Error('Not enough live gallery image samples were returned for verification');
          }
          for (const imagePath of uniqueSamples) {
            const response = await fetch(base + imagePath, {
              headers: { 'user-agent': 'ProCity-live-verifier/1.0' },
              redirect: 'follow'
            });
            if (!response.ok) throw new Error(imagePath + ' returned HTTP ' + response.status);
            const contentType = response.headers.get('content-type') || '';
            if (!contentType.toLowerCase().includes('image/webp')) {
              throw new Error(imagePath + ' has unexpected content-type ' + contentType);
            }
            await response.arrayBuffer();
          }

          console.log('PASS health: status=ok databaseReady=true projectCount=3502');
          console.log('PASS thumbnail recovery: 1 Thousand Bay Condos=' + thumbnailProject.image);
          console.log('PASS image proxy samples: ' + uniqueSamples.length + '/' + uniqueSamples.length);
          console.log('PROCITY_LIVE_VERIFICATION_COMPLETE');
          NODE
